<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para el amor de mi vida 🌻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #000002;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      touch-action: none;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }

    /* Etiquetas interactivas con ramos de flores (💐) al frente */
    .etiqueta-html {
      position: absolute;
      font-family: 'Caveat', cursive;
      font-size: 1.2rem;
      color: #fffde6;
      text-shadow: 0 0 10px rgba(255, 215, 0, 1), 0 0 20px rgba(255, 140, 0, 0.7);
      background: rgba(0, 0, 0, 0.65);
      padding: 4px 12px;
      border-radius: 16px;
      white-space: nowrap;
      border: 1.5px solid rgba(255, 215, 0, 0.5);
      backdrop-filter: blur(5px);
      cursor: pointer;
      pointer-events: auto;
      transform: translate(-50%, -50%);
      transition: transform 0.2s;
    }
    .etiqueta-html:hover { transform: translate(-50%, -50%) scale(1.2); }

    /* Carta modal romántica */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .modal.activo {
      opacity: 1;
      pointer-events: auto;
    }
    .carta {
      background: linear-gradient(135deg, #fffdf4 0%, #fff2cb 100%);
      color: #333;
      padding: 35px 25px 25px;
      border-radius: 22px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 25px 60px rgba(255, 215, 0, 0.5);
      position: relative;
      text-align: center;
      border: 2.5px solid #ffdf47;
      transform: translateY(25px);
      transition: transform 0.4s ease;
    }
    .modal.activo .carta { transform: translateY(0); }
    .carta h2 { font-family: 'Caveat', cursive; font-size: 2.5rem; color: #b87400; margin-bottom: 8px; }
    .carta p { font-size: 0.93rem; line-height: 1.6; color: #444; margin-bottom: 15px; text-align: left; }
    .firma { font-family: 'Caveat', cursive; font-size: 1.4rem; color: #9c5f00; margin-top: 10px; }
    .btn-cerrar {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 20px;
      background: #ffdf47;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      color: #555;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
  </style>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Música original de Floricienta -->
  <audio id="musica" src="https://files.freemusicarchive.org/storage-free-music-archive/music/ccCommunity/Floricienta/Flores_Amarillas.mp3" loop></audio>

  <div id="canvas-container"></div>
  <div id="labels-container" style="position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden;"></div>

  <div id="modal" class="modal">
    <div class="carta">
      <button id="btnCerrar" class="btn-cerrar">&times;</button>
      <h2 id="modal-titulo">Mi amor 🌻</h2>
      <p id="modal-texto">Cargando mensaje...</p>
      <div class="firma">Te amo con el alma 💛</div>
    </div>
  </div>

  <script>
    const audio = document.getElementById('musica');
    window.addEventListener('click', () => {
      audio.play().catch(() => {});
    }, { once: true });

    // Textura de punto suave para estrellas
    function crearTexturaPunto() {
      const canvas = document.createElement('canvas');
      canvas.width = 32; canvas.height = 32;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.4, 'rgba(255,230,100,0.8)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 32, 32);
      return new THREE.CanvasTexture(canvas);
    }

    // Textura de Girasol pequeño para el fondo 3D
    function crearTexturaGirasol() {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffcc00';
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.ellipse(32, 32, 7, 20, (i * Math.PI) / 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#462201';
      ctx.beginPath();
      ctx.arc(32, 32, 8, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Ajustar la cámara de forma responsiva según si es celular o PC
    const isMobile = window.innerWidth < 768;
    const initialZ = isMobile ? 110 : 85;

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = initialZ;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const galaxiaGroup = new THREE.Group();
    scene.add(galaxiaGroup);

    // 1. MUCHAS MÁS ESTRELLAS DE FONDO (Densidad alta y brillante)
    const starCount = 3500;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = [];
    for (let i = 0; i < starCount; i++) {
      starPositions.push((Math.random() - 0.5) * 220, (Math.random() - 0.5) * 220, (Math.random() - 0.5) * 220);
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.38, map: crearTexturaPunto(), transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
    galaxiaGroup.add(new THREE.Points(starGeometry, starMaterial));

    // 2. CORAZÓN CENTRAL DELICADO Y PEQUEÑO
    const heartParticlesCount = 6000;
    const heartGeometry = new THREE.BufferGeometry();
    const heartPositions = [];
    for (let i = 0; i < heartParticlesCount; i++) {
      const t = Math.PI * 2 * Math.random();
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      const z = (Math.random() - 0.5) * 4;
      heartPositions.push(x * 0.38, y * 0.38, z);
    }
    heartGeometry.setAttribute('position', new THREE.Float32BufferAttribute(heartPositions, 3));
    const heartMaterial = new THREE.PointsMaterial({ color: 0xffea00, size: 0.18, map: crearTexturaPunto(), transparent: true, opacity: 0.98, blending: THREE.AdditiveBlending });
    galaxiaGroup.add(new THREE.Points(heartGeometry, heartMaterial));

    // 3. MUCHOS MÁS GIRASOLES PEQUEÑOS FLOTANDO EN 360°
    const girasolTexture = crearTexturaGirasol();
    const girasolMaterial = new THREE.SpriteMaterial({ map: girasolTexture });

    for (let i = 0; i < 180; i++) { // Gran cantidad para que nunca se vea vacío
      const sprite = new THREE.Sprite(girasolMaterial);
      const radius = 12 + Math.random() * 55;
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * Math.PI;

      sprite.position.set(
        radius * Math.cos(phi) * Math.cos(theta),
        radius * Math.sin(phi),
        radius * Math.cos(phi) * Math.sin(theta)
      );
      const scale = 0.5 + Math.random() * 0.8;
      sprite.scale.set(scale, scale, 1);
      galaxiaGroup.add(sprite);
    }

    // 4. ETIQUETAS INTERACTIVAS CON MENSAJES ÚNICOS Y DIFERENTES
    const datosFlotantes = [
      { 
        etiqueta: "Te amo 💛", 
        pos: new THREE.Vector3(-18, 10, 4),
        titulo: "Mi razón de ser 🌻",
        texto: "Desde aquel noviembre de 2022 supe que iluminarías mis días. Eres lo más hermoso que me ha pasado."
      },
      { 
        etiqueta: "Eres mi sol ☀️", 
        pos: new THREE.Vector3(20, 11, -4),
        titulo: "Mi luz favorita ✨",
        texto: "Gracias por regalarme tus sonrisas y llenar de energía brillante cada momento que compartimos."
      },
      { 
        etiqueta: "Siempre juntos 🤝", 
        pos: new THREE.Vector3(-10, -18, 6),
        titulo: "Nuestro camino 💛",
        texto: "Desde el 05/05/2023 hemos superado todo juntos. No importa la prueba, a tu lado todo vale la pena."
      },
      { 
        etiqueta: "Mi Amor eterno 🌹", 
        pos: new THREE.Vector3(15, -16, -3),
        titulo: "Para ti mi vida 🌻",
        texto: "Te agradezco infinitamente por estar siempre firme a mi lado y amarme con todos mis defectos."
      },
      { 
        etiqueta: "Me encantas ✨", 
        pos: new THREE.Vector3(22, 0, 5),
        titulo: "Inigualable 💛",
        texto: "No hay persona en este mundo que se compare contigo. Tu forma de ser me enamora todos los días."
      },
      { 
        etiqueta: "Eres preciosa 👑", 
        pos: new THREE.Vector3(-21, -2, -5),
        titulo: "Hermosa mía ✨",
        texto: "Estas flores amarillas son solo un pequeño reflejo de lo mucho que te mereces en este mundo."
      }
    ];

    const labelsContainer = document.getElementById('labels-container');
    const modal = document.getElementById('modal');
    const modalTitulo = document.getElementById('modal-titulo');
    const modalTexto = document.getElementById('modal-texto');
    const etiquetaObjetos = [];

    datosFlotantes.forEach(item => {
      const dummyObj = new THREE.Object3D();
      dummyObj.position.copy(item.pos);
      galaxiaGroup.add(dummyObj);

      const div = document.createElement('div');
      div.className = 'etiqueta-html';
      div.innerHTML = `💐 ${item.etiqueta}`;
      div.addEventListener('click', () => {
        modalTitulo.innerText = item.titulo;
        modalTexto.innerText = item.texto;
        modal.classList.add('activo');
        audio.play().catch(() => {});
      });
      labelsContainer.appendChild(div);

      etiquetaObjetos.push({ obj: dummyObj, element: div });
    });

    // --- INTERACCIÓN DE ARRASTRE 360° ---
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let targetRotationY = 0;
    let targetRotationX = 0;

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      targetRotationY += (e.clientX - previousMousePosition.x) * 0.005;
      targetRotationX += (e.clientY - previousMousePosition.y) * 0.005;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    window.addEventListener('touchstart', (e) => {
      if(e.touches.length === 1) {
        isDragging = true;
        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      targetRotationY += (e.touches[0].clientX - previousMousePosition.x) * 0.005;
      targetRotationX += (e.touches[0].clientY - previousMousePosition.y) * 0.005;
      previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    window.addEventListener('touchend', () => { isDragging = false; });

    let zoomActivo = true;
    const targetZ = isMobile ? 38 : 26;
    function actualizarZoom() {
      if (zoomActivo && camera.position.z > targetZ) {
        camera.position.z -= 0.6;
        if (camera.position.z <= targetZ) zoomActivo = false;
      }
    }

    const vectorTemp = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      actualizarZoom();

      if (!isDragging) {
        targetRotationY += 0.0015;
      }

      galaxiaGroup.rotation.y += (targetRotationY - galaxiaGroup.rotation.y) * 0.1;
      galaxiaGroup.rotation.x += (targetRotationX - galaxiaGroup.rotation.x) * 0.1;

      renderer.render(scene, camera);

      etiquetaObjetos.forEach(item => {
        item.obj.getWorldPosition(vectorTemp);
        vectorTemp.project(camera);

        if (vectorTemp.z < 1) {
          const x = (vectorTemp.x *  .5 + .5) * window.innerWidth;
          const y = (vectorTemp.y * -.5 + .5) * window.innerHeight;
          item.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
          item.element.style.display = 'block';
        } else {
          item.element.style.display = 'none';
        }
      });
    }
    animate();

    document.getElementById('btnCerrar').addEventListener('click', () => {
      modal.classList.remove('activo');
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
